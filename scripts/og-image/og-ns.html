<!doctype html>
<!--
  Template da imagem de compartilhamento (Open Graph) — public/og-ns.png.
  Tamanho fixo 1200 × 630. Para regenerar (PowerShell, na raiz do projeto):

    & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new `
      --hide-scrollbars --window-size=1200,630 --screenshot="$PWD\og-raw.png" `
      "file:///$($PWD -replace '\\','/')/scripts/og-image/og-ns.html"
    node scripts/og-image/optimize.mjs og-raw.png public/og-ns.png

  Cores = tokens de src/styles/global.css. Logo = arquivo oficial da marca.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Space+Grotesk:wght@600;700&display=block"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #030504; }
      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(700px 420px at 8% -10%, rgb(34 224 112 / 0.16), transparent 62%),
          radial-gradient(520px 360px at 100% 110%, rgb(34 224 112 / 0.10), transparent 65%),
          #030504;
        font-family: Inter, system-ui, sans-serif;
        color: #f7faf8;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgb(255 255 255 / 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(255 255 255 / 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(ellipse 75% 85% at 30% 40%, #000 25%, transparent 80%);
                mask-image: radial-gradient(ellipse 75% 85% at 30% 40%, #000 25%, transparent 80%);
      }
      /* Formas diagonais (mesma linguagem do site) */
      .slab {
        position: absolute;
        top: -60px;
        right: -170px;
        width: 520px;
        height: 760px;
        transform: skewX(-14deg);
        background: linear-gradient(180deg, rgb(10 51 32 / 0.55), rgb(10 51 32 / 0) 75%);
        border-left: 1px solid rgb(34 224 112 / 0.18);
      }
      .frame {
        position: absolute;
        top: 120px;
        right: 120px;
        width: 210px;
        height: 210px;
        transform: skewX(-14deg);
        border: 2px solid rgb(34 224 112 / 0.55);
      }
      .frame.small {
        top: 380px;
        right: 300px;
        width: 90px;
        height: 90px;
        border-color: rgb(34 224 112 / 0.25);
        border-width: 1px;
      }
      .bar {
        position: absolute;
        top: 352px;
        right: 120px;
        width: 210px;
        height: 10px;
        transform: skewX(-14deg);
        background: #22e070;
        box-shadow: 0 0 40px rgb(34 224 112 / 0.55);
      }
      .content {
        position: absolute;
        left: 80px;
        top: 70px;
        width: 790px;
      }
      .logo { height: 78px; width: auto; display: block; }
      h1 {
        margin-top: 64px;
        font-family: 'Space Grotesk', Inter, sans-serif;
        font-weight: 700;
        font-size: 74px;
        line-height: 1.02;
        letter-spacing: -1.5px;
        text-transform: uppercase;
      }
      h1 span { color: #3fe884; }
      .subtitle {
        margin-top: 26px;
        font-size: 27px;
        font-weight: 600;
        line-height: 1.3;
        color: #f7faf8;
      }
      .footer {
        position: absolute;
        left: 80px;
        bottom: 56px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        font-weight: 500;
        color: #a7b0ab;
      }
      .footer i {
        display: inline-block;
        width: 34px;
        height: 4px;
        background: #22e070;
        transform: skewX(-30deg);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="grid"></div>
      <div class="slab"></div>
      <div class="frame"></div>
      <div class="frame small"></div>
      <div class="bar"></div>

      <div class="content">
        <img class="logo" src="../../src/assets/brand/logo-ns-transparente.png" alt="NS | Nelson Schiavi Soluções Digitais" />
        <h1>Sua ideia em um site<br /><span>de verdade</span>.</h1>
        <p class="subtitle">Sites e soluções digitais personalizados para empresas.</p>
      </div>

      <div class="footer"><i></i>Atendimento direto com o desenvolvedor</div>
    </div>
  </body>
</html>
